<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Tayyab Ismail — Senior Data and AI Engineer">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b6ff00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c45d3a" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b6ff00" stop-opacity="0"/>
      <stop offset="50%" stop-color="#b6ff00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b6ff00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <style>
      .caret { animation: blink 1.1s steps(1) infinite }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none } }
    </style>
  </defs>

  <rect width="1280" height="420" rx="20" fill="#0b0b09"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)"/>
  <circle cx="1120" cy="70" r="300" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="20" fill="url(#vig)"/>


  <!-- eyebrow pill -->
  <g>
    <rect x="72" y="66" width="240" height="30" rx="8" fill="#b6ff00"/>
    <text x="87" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700" letter-spacing="1.8" fill="#0a0a0a">SENIOR DATA &amp; AI ENGINEER</text>
  </g>

  <!-- headline -->
  <g>
    <text x="72" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="66" font-weight="700" letter-spacing="-2.5" fill="#f4f1eb">Tayyab Ismail</text>
  </g>

  <g>
    <text x="72" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" fill="#a9a79f">I don&#8217;t talk about AI. <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="29" fill="#e0764f">I build with it.</tspan></text>
    <rect class="caret" x="590" y="216" width="12" height="26" fill="#b6ff00"/>
  </g>

  <!-- stat strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <text x="72" y="316" font-size="30" font-weight="700" fill="#b6ff00">30+</text>
      <text x="72" y="340" font-size="12.5" letter-spacing="1.4" fill="#8c8c86">AI SYSTEMS SHIPPED</text>
    </g>
    <rect x="290" y="292" width="1" height="52" fill="#2a2a26"/>
    <g>
      <text x="330" y="316" font-size="30" font-weight="700" fill="#b6ff00">12+</text>
      <text x="330" y="340" font-size="12.5" letter-spacing="1.4" fill="#8c8c86">INDUSTRIES SERVED</text>
    </g>
    <rect x="548" y="292" width="1" height="52" fill="#2a2a26"/>
    <g>
      <text x="588" y="316" font-size="30" font-weight="700" fill="#b6ff00">6</text>
      <text x="588" y="340" font-size="12.5" letter-spacing="1.4" fill="#8c8c86">COUNTRIES, REMOTE-FIRST</text>
    </g>
    <rect x="856" y="292" width="1" height="52" fill="#2a2a26"/>
    <g>
      <text x="896" y="316" font-size="30" font-weight="700" fill="#b6ff00">1</text>
      <text x="896" y="340" font-size="12.5" letter-spacing="1.4" fill="#8c8c86">SOLO OPERATOR, NO HANDOFFS</text>
    </g>
  </g>

  <!-- terminal card -->
  <g transform="translate(880, 62)">
    <rect x="0" y="0" width="330" height="176" rx="14" fill="#111110" stroke="#2a2a26"/>
    <rect x="0" y="0" width="330" height="34" rx="14" fill="#17170f"/>
    <rect x="0" y="24" width="330" height="10" fill="#17170f"/>
    <circle cx="20" cy="17" r="4.5" fill="#e0764f"/>
    <circle cx="36" cy="17" r="4.5" fill="#c9c25a"/>
    <circle cx="52" cy="17" r="4.5" fill="#b6ff00"/>
    <text x="88" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#6f6f68">tayyab@ai-eng: ~</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="20" y="64" fill="#b6ff00">$ <tspan fill="#e8e6df">whoami</tspan></text>
      <text x="20" y="88" fill="#8c8c86">ai_engineer --solo --production</text>
      <text x="20" y="116" fill="#b6ff00">$ <tspan fill="#e8e6df">stack --top</tspan></text>
      <text x="20" y="140" fill="#8c8c86">python · claude · langchain · n8n</text>
      <text x="20" y="160" fill="#8c8c86">rag · agents · voice · fastapi</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="419" rx="20" fill="none" stroke="#26261f"/>
</svg>
